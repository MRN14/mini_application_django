{% include "magasin/includes/head.html" %}

<main>
	<h1>Liste des produits</h1>
	{% if products %}
		<p>{{count}}
			résultats</p>
		<ul>
			{% for product in products %}
				<li>{{product.name}}</li>
			{% endfor %}
		</ul>
	{% else %}
		<p>Aucun produit trouvé</p>
	{% endif %}
</main>
