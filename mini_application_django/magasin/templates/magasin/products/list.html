{% extends "magasin/includes/base.html" %}

{% block content %}

	<h1>Liste des produits</h1>
	{% if products %}
		<table>
			<caption>
				{{count}}
				résultats
			</caption>
			<thead>
				<tr>
					<th scope="col">référence</th>
					<th scope="col">nom</th>
					<th scope="col">stock</th>
				</tr>
			</thead>
			<tbody>
				{% for product in products %}
					<tr>
						<td>
							<a href="/produit/{{product.ref}}">{{product.ref}}</a>
						</td>
						<td>{{product.name}}</td>
						<td>{{product.stock}}</td>
					</tr>
				{% endfor %}
			</tbody>
		</table>
	{% else %}
		<p>Aucun produit trouvé</p>
	{% endif %}
{% endblock %}
